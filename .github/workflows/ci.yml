name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: kolekcia.settings.local
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "True"
      - run: python manage.py test apps.core
        env:
          DJANGO_SETTINGS_MODULE: kolekcia.settings.local
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "True"

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: koleqcia_ci
          POSTGRES_USER: koleqcia
          POSTGRES_PASSWORD: koleqcia-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koleqcia -d koleqcia_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: kolekcia.settings.production
          SECRET_KEY: ci-production-check-secret-key-longer-than-thirty-two-bytes
          DATABASE_URL: postgresql://koleqcia:koleqcia-ci-password@127.0.0.1:5432/koleqcia_ci
          DB_SSLMODE: disable
          ALLOWED_HOSTS: localhost
          CORS_ALLOWED_ORIGINS: http://localhost:3000
      - run: python manage.py check --database default
        env:
          DJANGO_SETTINGS_MODULE: kolekcia.settings.production
          SECRET_KEY: ci-production-check-secret-key-longer-than-thirty-two-bytes
          DATABASE_URL: postgresql://koleqcia:koleqcia-ci-password@127.0.0.1:5432/koleqcia_ci
          DB_SSLMODE: disable
          ALLOWED_HOSTS: localhost
          CORS_ALLOWED_ORIGINS: http://localhost:3000
      - run: python manage.py test
        env:
          DJANGO_SETTINGS_MODULE: kolekcia.settings.postgres_test
          SECRET_KEY: ci-production-check-secret-key-longer-than-thirty-two-bytes
          DATABASE_URL: postgresql://koleqcia:koleqcia-ci-password@127.0.0.1:5432/koleqcia_ci
          DB_SSLMODE: disable
          ALLOWED_HOSTS: localhost,testserver
          CORS_ALLOWED_ORIGINS: http://localhost:3000
